<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSON 格式化 · SolHub</title>
<style>
  :root{
    --bg:#f7f5f2; --card:#fff; --ink:#18181b; --muted:#71717a; --line:#e8e4de;
    --soft:#f1ede8; --accent:#d96a24; --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);color-scheme:light;
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto;padding:28px 20px 56px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .mark{width:38px;height:38px;border-radius:11px;background:#fff;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgb(24 24 27/.06)}
  h1{font-size:19px;line-height:1.2;margin:0;letter-spacing:-.01em}
  header p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
  .card + .card{margin-top:14px}
  .lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-bottom:8px}
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
  .btn{font:inherit;font-size:12.5px;font-weight:600;border-radius:9px;padding:7px 11px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--ink);transition:.15s}
  .btn:hover{background:#faf8f6}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(.95)}
  .btn.mini{font-size:11.5px;padding:5px 9px}
  .spacer{flex:1 1 auto}
  .seg{display:inline-flex;background:var(--soft);border-radius:9px;padding:3px;gap:2px}
  .seg button{border:0;background:none;font:inherit;font-size:12px;font-weight:600;color:var(--muted);
    padding:5px 9px;border-radius:7px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgb(24 24 27/.08)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:860px){ .cols{grid-template-columns:1fr} }
  textarea{width:100%;height:340px;resize:vertical;border:1px solid var(--line);border-radius:10px;
    padding:12px;background:#fdfcfb;color:var(--ink);outline:none;
    font:12.5px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;tab-size:2}
  textarea:focus{border-color:#d3cbc1;background:#fff}
  textarea.err{border-color:#f0b4b4;background:#fffafa}
  .status{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .dot{width:6px;height:6px;border-radius:50%;background:#a1a1aa;flex:0 0 auto}
  .dot.ok{background:#16a34a}
  .dot.bad{background:#dc2626}
  .msg{font-size:12px;line-height:1.6;margin-top:8px;padding:8px 10px;border-radius:8px;display:none}
  .msg.show{display:block}
  .msg.ok{background:#eefaf1;border:1px solid #cdebd5;color:#15803d}
  .msg.bad{background:#fdeeee;border:1px solid #f6d3d3;color:#b91c1c;white-space:pre-wrap}
  .hint{font-size:11.5px;color:#a1a1aa;margin-top:8px}
  footer{margin-top:26px;text-align:center;font-size:11.5px;color:#a1a1aa}
  @media (max-width:520px){ .wrap{padding:20px 14px 48px} .card{padding:13px} textarea{height:240px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#18181b" stroke-width="1.7" stroke-linecap="round">
        <path d="M8 4c-2 0-2.5 1.4-2.5 3.2v1.4C5.5 10 5 11 3.6 11.4V12.6C5 13 5.5 14 5.5 15.4v1.4C5.5 18.6 6 20 8 20"/>
        <path d="M16 4c2 0 2.5 1.4 2.5 3.2v1.4c0 1.4.5 2.4 1.9 2.8v1.2c-1.4.4-1.9 1.4-1.9 2.8v1.4c0 1.8-.5 3.2-2.5 3.2"/>
        <circle cx="12" cy="9.2" r="1" fill="#d96a24" stroke="none"/>
        <circle cx="12" cy="14.8" r="1" fill="#d96a24" stroke="none"/>
      </svg>
    </div>
    <div>
      <h1>JSON 格式化</h1>
      <p>格式化、压缩、键排序、报错定位到行列，还能把 JSON 转成 TypeScript 类型。全程本地处理。</p>
    </div>
  </header>

  <div class="card">
    <div class="toolbar">
      <button class="btn primary" id="fmt" type="button">格式化</button>
      <button class="btn" id="min" type="button">压缩</button>
      <button class="btn" id="sort" type="button">键排序</button>
      <button class="btn" id="ts" type="button">转 TS 类型</button>
      <div class="seg" id="indent">
        <button type="button" data-v="2" class="on">2 空格</button>
        <button type="button" data-v="4">4 空格</button>
        <button type="button" data-v="tab">Tab</button>
      </div>
      <span class="spacer"></span>
      <button class="btn" id="sample" type="button">示例</button>
      <button class="btn" id="clear" type="button">清空</button>
    </div>

    <div class="cols">
      <div>
        <div class="lbl">输入</div>
        <textarea id="input" spellcheck="false" placeholder='粘贴 JSON，例如 {"name":"SolHub","tags":["工具","网站"]}'></textarea>
        <div class="status">
          <span class="dot" id="dot"></span>
          <span id="stat">等待输入</span>
        </div>
      </div>
      <div>
        <div class="lbl" style="display:flex;align-items:center;justify-content:space-between">
          <span>输出</span>
          <span style="display:flex;gap:6px">
            <button class="btn mini" id="copy" type="button">复制</button>
            <button class="btn mini" id="down" type="button">下载</button>
          </span>
        </div>
        <textarea id="output" spellcheck="false" readonly placeholder="结果显示在这里"></textarea>
        <div class="msg" id="msg"></div>
      </div>
    </div>
    <p class="hint">快捷键：⌘/Ctrl + Enter 格式化。超过 2MB 的文本浏览器会卡，建议先切片。</p>
  </div>

  <footer>SolHub 官方工具 · 所有处理都在你的浏览器内完成</footer>
</div>

<script>
(function () {
  var input = document.getElementById("input");
  var output = document.getElementById("output");
  var msg = document.getElementById("msg");
  var dot = document.getElementById("dot");
  var stat = document.getElementById("stat");
  var indent = "2";

  var SAMPLE = {
    name: "SolHub",
    url: "https://solhub.solyoung.top",
    topics: ["网站", "在线工具"],
    stats: { products: 13, tools: 4, verified: true },
    owner: { handle: "solyoung", links: { github: "https://github.com/SolYoung-Ai" } }
  };

  function setMsg(kind, text) {
    msg.className = "msg show " + kind;
    msg.textContent = text;
    dot.className = "dot " + (kind === "ok" ? "ok" : "bad");
  }

  function clearMsg() {
    msg.className = "msg";
    msg.textContent = "";
    dot.className = "dot";
  }

  /* 把 JSON.parse 的报错补出「第几行、第几列、上下文」 */
  function describeError(err, text) {
    var m = /position (\d+)/.exec(err.message || "");
    if (!m) return err.message;
    var pos = Number(m[1]);
    var before = text.slice(0, pos);
    var line = before.split("\n").length;
    var col = pos - before.lastIndexOf("\n");
    var lines = text.split("\n");
    var cur = (lines[line - 1] || "");
    var caret = new Array(Math.max(col, 1)).join(" ") + "^";
    return "解析失败：第 " + line + " 行第 " + col + " 列\n" + cur.slice(0, 120) + "\n" + caret;
  }

  function parse() {
    var text = input.value.trim();
    if (!text) {
      clearMsg();
      output.value = "";
      stat.textContent = "等待输入";
      input.classList.remove("err");
      return null;
    }
    try {
      var data = JSON.parse(text);
      input.classList.remove("err");
      var bytes = new Blob([text]).size;
      var count = 0;
      (function walk(v) {
        if (Array.isArray(v)) { v.forEach(walk); }
        else if (v && typeof v === "object") { Object.keys(v).forEach(function (k) { count++; walk(v[k]); }); }
        else if (v !== null) { count++; }
      })(data);
      stat.textContent = "有效 JSON · " + bytes + " 字节 · " + count + " 个值";
      dot.className = "dot ok";
      return data;
    } catch (e) {
      input.classList.add("err");
      stat.textContent = "语法错误";
      clearMsg();
      setMsg("bad", describeError(e, text));
      return null;
    }
  }

  function pretty(data) {
    var opt = indent === "tab" ? "\t" : Number(indent);
    output.value = JSON.stringify(data, null, opt);
    clearMsg();
    setMsg("ok", "已格式化");
  }

  function run(fn) {
    var data = parse();
    if (data === null && input.value.trim()) return;
    if (data === null) return;
    fn(data);
  }

  document.getElementById("fmt").addEventListener("click", function () {
    run(pretty);
  });

  document.getElementById("min").addEventListener("click", function () {
    run(function (data) {
      output.value = JSON.stringify(data);
      clearMsg();
      setMsg("ok", "已压缩为单行");
    });
  });

  /* 递归按 key 重排（数组保持原有顺序） */
  function sortKeys(v) {
    if (Array.isArray(v)) return v.map(sortKeys);
    if (v && typeof v === "object") {
      var out = {};
      Object.keys(v).sort().forEach(function (k) { out[k] = sortKeys(v[k]); });
      return out;
    }
    return v;
  }

  document.getElementById("sort").addEventListener("click", function () {
    run(function (data) {
      var opt = indent === "tab" ? "\t" : Number(indent);
      output.value = JSON.stringify(sortKeys(data), null, opt);
      clearMsg();
      setMsg("ok", "已按字母顺序排列键");
    });
  });

  /* JSON → TypeScript interface：嵌套对象各自生成一个 interface，
     数组按元素类型合并，null 视为可选字段。 */
  function toTs(data) {
    var blocks = [];
    var seen = [];   /* [{ obj, name }]，同一个对象复用同一个名字 */

    function typeName(k) {
      var n = String(k).replace(/[^A-Za-z0-9]+(.)?/g, function (_, c) { return c ? c.toUpperCase() : ""; });
      n = n.charAt(0).toUpperCase() + n.slice(1);
      return n || "Item";
    }
    function singular(s) {
      if (/ies$/.test(s)) return s.replace(/ies$/, "y");
      if (/s$/.test(s) && s.length > 1) return s.slice(0, -1);
      return s;
    }
    function nameFor(obj, hint) {
      for (var i = 0; i < seen.length; i++) if (seen[i].obj === obj) return seen[i].name;
      var name = hint;
      var n = 2;
      while (seen.some(function (s2) { return s2.name === name; })) { name = hint + n; n++; }
      seen.push({ obj: obj, name: name });
      return name;
    }
    function primitive(v) {
      if (v === null) return "null";
      if (Array.isArray(v)) return "unknown[]";
      return typeof v;
    }
    function build(v, hint) {
      var name = nameFor(v, hint);
      var keys = Object.keys(v);
      var body = keys.map(function (k) {
        var val = v[k];
        var t;
        if (Array.isArray(val)) {
          if (!val.length) {
            t = "unknown[]";
          } else {
            var parts = [];
            val.forEach(function (item) {
              var it = item && typeof item === "object" && !Array.isArray(item)
                ? build(item, singular(typeName(k)))
                : primitive(item);
              if (parts.indexOf(it) === -1) parts.push(it);
            });
            t = parts.length === 1 ? parts[0] + "[]" : "(" + parts.join(" | ") + ")[]";
          }
        } else if (val && typeof val === "object") {
          t = build(val, typeName(k));
        } else {
          t = primitive(val);
        }
        var key = /^[A-Za-z_$][A-Za-z0-9_$]*$/.test(k) ? k : JSON.stringify(k);
        return "  " + key + (val === null ? "?" : "") + ": " + t + ";";
      }).join("\n");
      blocks.push("export interface " + name + " {\n" + body + "\n}");
      return name;
    }

    if (Array.isArray(data)) {
      var first = data[0];
      var inner = first && typeof first === "object" && !Array.isArray(first) ? build(first, "Item") : primitive(first);
      return blocks.join("\n\n") + "\n\nexport type Root = " + inner + "[];";
    }
    if (!data || typeof data !== "object") return "export type Root = " + primitive(data) + ";";
    var root = build(data, "Root");
    return blocks.join("\n\n");
  }

  document.getElementById("ts").addEventListener("click", function () {
    run(function (data) {
      output.value = toTs(data);
      clearMsg();
      setMsg("ok", "已生成 TypeScript 类型");
    });
  });

  document.getElementById("indent").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    this.querySelectorAll("button").forEach(function (x) { x.classList.remove("on"); });
    b.classList.add("on");
    indent = b.dataset.v;
    if (output.value.trim()) {
      try {
        var opt = indent === "tab" ? "\t" : Number(indent);
        var data = JSON.parse(input.value);
        output.value = JSON.stringify(data, null, opt);
      } catch (e2) { /* 输入不是 JSON 时不动输出（可能是 TS 类型） */ }
    }
  });

  document.getElementById("sample").addEventListener("click", function () {
    input.value = JSON.stringify(SAMPLE, null, 2);
    parse();
    pretty(SAMPLE);
  });

  document.getElementById("clear").addEventListener("click", function () {
    input.value = "";
    output.value = "";
    clearMsg();
    input.classList.remove("err");
    dot.className = "dot";
    stat.textContent = "等待输入";
    input.focus();
  });

  document.getElementById("copy").addEventListener("click", function () {
    var text = output.value;
    if (!text) return;
    var btn = this;
    var done = function () {
      btn.textContent = "已复制";
      setTimeout(function () { btn.textContent = "复制"; }, 1400);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, done);
    else { output.select(); document.execCommand("copy"); done(); }
  });

  document.getElementById("down").addEventListener("click", function () {
    var text = output.value;
    if (!text) return;
    var isTs = /^export (interface|type)/m.test(text);
    var blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = isTs ? "types.ts" : "data.json";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  });

  input.addEventListener("input", function () {
    clearMsg();
    if (!input.value.trim()) {
      dot.className = "dot";
      stat.textContent = "等待输入";
      input.classList.remove("err");
      return;
    }
    /* 边输入边做轻量校验，但不动输出区（避免打断编辑） */
    try {
      JSON.parse(input.value);
      dot.className = "dot ok";
      stat.textContent = "有效 JSON · " + new Blob([input.value]).size + " 字节";
      input.classList.remove("err");
    } catch (e) {
      dot.className = "dot bad";
      stat.textContent = "语法错误";
      input.classList.add("err");
    }
  });

  input.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
      e.preventDefault();
      document.getElementById("fmt").click();
    }
  });

  document.getElementById("sample").click();
})();
</script>
</body>
</html>
