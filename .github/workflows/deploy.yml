name: Build & Deploy to solyoung.top

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: BASE_PATH=/solhub/ npm run build

      - name: Generate token from GitHub App
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: SolYoung-Ai
          repositories: SolYoung

      - name: Deploy to SolYoung repo
        env:
          DEPLOY_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --global user.name "SolHub Bot"
          git config --global user.email "solhub-bot@users.noreply.github.com"
          
          git clone https://x-access-token:${DEPLOY_TOKEN}@github.com/SolYoung-Ai/SolYoung.git _deploy
          
          rm -rf _deploy/solhub
          mkdir -p _deploy/solhub
          cp -r dist/* _deploy/solhub/
          
          cd _deploy
          git add solhub
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "deploy: solhub update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
