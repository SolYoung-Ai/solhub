name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 计算 GitHub Pages 站点的 base 路径，优先级：
      # 1. 仓库 Variables 中的 BASE_PATH（如 /solhub/，用于自定义域名下的路径部署，如 https://solyoung.top/solhub/）
      # 2. 仓库名为 <owner>.github.io → base=/
      # 3. 其他仓库名 → base=/<repo>/（github.io 子路径）
      # ASTRO_SITE（仓库 Variables）只决定 canonical/sitemap 的站点地址，
      # 例如 https://solyoung.top（最终对外域名），不再影响 base。
      - name: Compute base path
        id: base
        run: |
          if [ -n "${{ vars.BASE_PATH }}" ]; then
            echo "base=${{ vars.BASE_PATH }}" >> "$GITHUB_OUTPUT"
          else
            REPO="${{ github.repository }}"
            NAME="${REPO#*/}"
            if [[ "$NAME" == "${{ github.repository_owner }}.github.io" ]]; then
              echo "base=/" >> "$GITHUB_OUTPUT"
            else
              echo "base=/$NAME/" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build
        run: BASE_PATH=${{ steps.base.outputs.base }} npm run build
        env:
          ASTRO_SITE: ${{ vars.ASTRO_SITE }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
