name: Build & Deploy to solyoung.top

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: BASE_PATH=/solhub/ npm run build

      - name: Deploy to SolYoung repo
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          git config --global user.name "SolHub Bot"
          git config --global user.email "solhub-bot@users.noreply.github.com"
          
          # Clone the SolYoung main repo
          git clone https://x-access-token:${DEPLOY_TOKEN}@github.com/SolYoung-Ai/SolYoung.git _deploy
          
          # Clear and copy dist/ to solhub/ subdirectory
          rm -rf _deploy/solhub
          mkdir -p _deploy/solhub
          cp -r dist/* _deploy/solhub/
          
          # Commit and push
          cd _deploy
          git add solhub
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "deploy: solhub update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
