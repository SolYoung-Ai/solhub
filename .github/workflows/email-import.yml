name: Auto-import products from email

on:
  # 定时触发已关闭（2026-11-25 安全体检）：这条链路把邮件正文里解析出的字段直接
  # commit 进 main，等于「任何能给收件箱发信的人都能往站点上塞内容」，而它上线以来
  # 一次都没有成功产出过提交（git log 里没有 auto: add 记录）。站内 /submit 已经
  # 是带登录 + 可达性校验的主路径。要临时用可手动 Run workflow。
  # schedule:
  #   - cron: "0 * * * *"  # Every hour
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install imap-tools

      - name: Run email import
        env:
          OUTLOOK_EMAIL: ${{ secrets.OUTLOOK_EMAIL }}
          OUTLOOK_APP_PASSWORD: ${{ secrets.OUTLOOK_APP_PASSWORD }}
        run: python scripts/email_import.py
