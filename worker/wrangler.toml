name = "solhub-auth"
main = "index.js"
compatibility_date = "2024-01-01"
account_id = "01624aee8adc7c5730447831e3bb38ab"

# 自定义域名：国内用户无法稳定访问 *.workers.dev，绑定自有域名后可达。
# `wrangler deploy` 会自动在 solyoung.top zone 下创建该域名绑定
#（要求 solyoung.top 的 DNS 托管在同一个 Cloudflare 账号）。
routes = [
  { pattern = "solhub-auth.solyoung.top", custom_domain = true }
]

[[kv_namespaces]]
binding = "PROFILES"
id = "bad8c625ab4846eb97b71b7166a3fab0"
