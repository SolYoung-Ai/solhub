name = "solhub-auth"
main = "index.js"
compatibility_date = "2024-01-01"
account_id = "01624aee8adc7c5730447831e3bb38ab"

# 自定义域名（solyoung.top DNS 已迁移至 Cloudflare）
routes = [
  { pattern = "solhub-auth.solyoung.top", custom_domain = true }
]

# 自定义域名生效后可关闭 workers.dev（国内不可达）
workers_dev = true

# 管理后台白名单（逗号分隔的登录名；邮箱账号即邮箱地址）
[vars]
ADMIN_EMAILS = "solyoungwork@gmail.com"

# 官方账号自动推荐：每天两次（UTC 02:00 / 12:00 = 北京时间 10:00 / 20:00）
# 2026-11-02 起认证服务已整体迁到 CloudBase，这个定时任务由 CloudBase 的
# Event 函数 solhub-cron 承担（HTTP 函数不支持 timer 触发器）。
# Worker 仅作为回滚用的备用 API 保留，不再跑 cron —— 否则它会在 Cloudflare KV
# 里写出一批永远不会展示的推荐帖，还白烧 KV 的写入额度。
[triggers]
crons = []

[[kv_namespaces]]
binding = "PROFILES"
id = "bad8c625ab4846eb97b71b7166a3fab0"
